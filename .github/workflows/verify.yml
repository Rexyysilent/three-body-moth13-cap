name: Verify release certificate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Install interval-arithmetic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 libboost-all-dev libgmp-dev libmpfr-dev libmpfi-dev

      - name: Run release and certificate checks
        run: bash scripts/check_release.sh

      - name: Preserve verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-verification-${{ github.sha }}
          path: |
            release-check.log
            proof/reproduction/run_quick/certificate.txt
          if-no-files-found: warn
